[package]
name = "nepteer"
version = "0.1.0-alpha.0"
description = "Nepteer mock-only handheld companion foundation"
edition = "2021"
publish = false

[lib]
name = "nepteer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "11", features = ["serde-compat", "no-serde-warnings"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
serde_json = "1"
