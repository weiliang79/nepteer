[package]
name = "nepteer"
version = "0.4.0-alpha.0"
description = "Nepteer read-only Windows handheld telemetry"
edition = "2021"
publish = false

[lib]
name = "nepteer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-global-shortcut = "2"
ts-rs = { version = "11", features = ["serde-compat", "no-serde-warnings"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }
wmi = { version = "0.18.4", default-features = false }
