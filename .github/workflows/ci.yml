name: Desktop CI
on:
  push:
    branches:
      [
        main,
        feat/foundation,
        feat/windows-telemetry,
        feat/quick-access-menu,
        feat/neptune-discovery,
        feat/neptune-input-decoding,
        feat/neptune-button-correlation,
        feat/neptune-qam-shortcut,
        feat/neptune-dpad-correlation,
        feat/qam-controller-navigation,
        research/controller-input-routing,
        research/windows-sensor-feasibility,
        feat/qam-navigation-ux,
        feat/qam-interaction-refinements,
        feat/qam-functional-settings,
      ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VITE_ENABLE_QAM_FOCUS_DIAGNOSTICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build:web
      - run: pnpm rust:check
      - run: pnpm rust:test
      - run: pnpm rust:lint
      - name: Build native Windows x86_64 installer
        if: runner.os == 'Windows'
        run: pnpm build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Verify Windows outputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = "target/x86_64-pc-windows-msvc/release"
          Get-Item "$release/nepteer.exe" -ErrorAction Stop
          $installers = @(Get-ChildItem "$release/bundle/nsis/*-setup.exe" -ErrorAction Stop)
          if ($installers.Count -eq 0) { throw "NSIS installer was not produced" }
          $installers | Format-Table Name, Length
          $manifestTool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/mt.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $manifestTool) { throw "Windows SDK manifest tool not found" }
          $exe = (Resolve-Path "$release/nepteer.exe").Path
          $manifestPath = "$env:RUNNER_TEMP/nepteer.manifest"
          & $manifestTool.FullName "-inputresource:$exe;#1" "-out:$manifestPath"
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract executable manifest" }
          [xml]$manifest = Get-Content $manifestPath -Raw
          $execution = $manifest.SelectSingleNode("//*[local-name()='requestedExecutionLevel']")
          if ($execution.level -ne "asInvoker" -or $execution.uiAccess -ne "false") {
            throw "Executable must run asInvoker with uiAccess=false"
          }
          Write-Host "Verified executable manifest: asInvoker, uiAccess=false"
      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        run: pnpm build --bundles app
      - name: Verify normal production excludes QAM focus diagnostics
        run: node scripts/verify-qam-focus-build.mjs disabled
      - name: Record JavaScript licenses
        run: pnpm licenses:js > javascript-licenses.json
      - name: Record Rust licenses
        run: pnpm licenses:rust > rust-licenses.json
      - name: Upload Windows installer and runnable binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nepteer-windows-x86_64-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            target/x86_64-pc-windows-msvc/release/nepteer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses-${{ runner.os }}-${{ github.sha }}
          path: |
            javascript-licenses.json
            rust-licenses.json
