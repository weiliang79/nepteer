name: Desktop CI
on:
  push:
    branches:
      [
        main,
        feat/foundation,
        feat/windows-telemetry,
        feat/quick-access-menu,
        feat/neptune-discovery,
        feat/neptune-input-decoding,
        feat/neptune-button-correlation,
        feat/neptune-qam-shortcut,
        feat/neptune-dpad-correlation,
        feat/qam-controller-navigation,
        research/controller-input-routing,
        research/windows-sensor-feasibility,
        experiment/hwinfo-shared-memory-feasibility,
        feat/qam-navigation-ux,
        feat/qam-interaction-refinements,
        feat/qam-functional-settings,
      ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VITE_ENABLE_QAM_FOCUS_DIAGNOSTICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build:web
      - run: pnpm rust:check
      - run: pnpm rust:test
      - run: pnpm rust:lint
      - name: Build native Windows x86_64 installer
        if: runner.os == 'Windows'
        run: pnpm build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Verify Windows outputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = "target/x86_64-pc-windows-msvc/release"
          Get-Item "$release/nepteer.exe" -ErrorAction Stop
          $installers = @(Get-ChildItem "$release/bundle/nsis/*-setup.exe" -ErrorAction Stop)
          if ($installers.Count -eq 0) { throw "NSIS installer was not produced" }
          $installers | Format-Table Name, Length
          $manifestTool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/mt.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $manifestTool) { throw "Windows SDK manifest tool not found" }
          $exe = (Resolve-Path "$release/nepteer.exe").Path
          $manifestPath = "$env:RUNNER_TEMP/nepteer.manifest"
          & $manifestTool.FullName "-inputresource:$exe;#1" "-out:$manifestPath"
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract executable manifest" }
          [xml]$manifest = Get-Content $manifestPath -Raw
          $execution = $manifest.SelectSingleNode("//*[local-name()='requestedExecutionLevel']")
          if ($execution.level -ne "asInvoker" -or $execution.uiAccess -ne "false") {
            throw "Executable must run asInvoker with uiAccess=false"
          }
          Write-Host "Verified executable manifest: asInvoker, uiAccess=false"
      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        run: pnpm build --bundles app
      - name: Verify normal production excludes QAM focus diagnostics
        run: node scripts/verify-qam-focus-build.mjs disabled
      - name: Record JavaScript licenses
        run: pnpm licenses:js > javascript-licenses.json
      - name: Record Rust licenses
        run: pnpm licenses:rust > rust-licenses.json
      - name: Upload Windows installer and runnable binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nepteer-windows-x86_64-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            target/x86_64-pc-windows-msvc/release/nepteer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses-${{ runner.os }}-${{ github.sha }}
          path: |
            javascript-licenses.json
            rust-licenses.json

  hwinfo-probe-build-only:
    name: Experimental HWiNFO probe — interface blocked, build and synthetic tests only
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/hwinfo-shared-memory-probe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/hwinfo-shared-memory-probe -> target
      - run: cargo fmt -- --check
      - run: cargo check --locked --target x86_64-pc-windows-msvc
      - run: cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - name: Synthetic CLI tests only — no mapping access or parser
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Verify manifest and stage blocked manual-only artifact
        shell: pwsh
        run: |
          $exe = (Resolve-Path "target/x86_64-pc-windows-msvc/release/hwinfo-shared-memory-probe.exe").Path
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/mt.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mt) { throw "Windows SDK manifest tool not found" }
          & $mt.FullName "-inputresource:$exe;#1" "-out:target/probe.manifest"
          if ($LASTEXITCODE -ne 0) { throw "Manifest extraction failed" }
          [xml]$manifest = Get-Content "target/probe.manifest" -Raw
          $execution = @($manifest.SelectNodes("//*[local-name()='requestedExecutionLevel']"))
          if ($execution.Count -ne 1 -or $execution[0].level -ne "asInvoker" -or $execution[0].uiAccess -ne "false") {
            throw "Probe must run asInvoker, uiAccess=false"
          }
          New-Item -ItemType Directory -Path "target/manual-only-artifact" -Force | Out-Null
          Copy-Item $exe "target/manual-only-artifact/EXPERIMENTAL-HWINFO-SHARED-MEMORY-PROBE-MANUAL-RUN-ONLY.exe"
          Copy-Item "README.txt", "THIRD-PARTY-NOTICES.txt" "target/manual-only-artifact/"
          Copy-Item "../../docs/LICENSES.md" "target/manual-only-artifact/LICENSE-STATUS.md"
          Copy-Item "../../docs/experiments/step-6b3-hwinfo-shared-memory.md" "target/manual-only-artifact/PROCEDURE.md"
          $env:GITHUB_SHA | Set-Content "target/manual-only-artifact/COMMIT.txt"
          cargo metadata --locked --format-version 1 | Set-Content "target/manual-only-artifact/dependency-metadata.json"
          if ($LASTEXITCODE -ne 0) { throw "Probe inventory failed" }
      - name: Upload blocked HWiNFO experiment — never production telemetry
        uses: actions/upload-artifact@v4
        with:
          name: EXPERIMENTAL-HWINFO-SHARED-MEMORY-PROBE-MANUAL-RUN-ONLY-windows-x86_64-${{ github.sha }}
          if-no-files-found: error
          path: tools/hwinfo-shared-memory-probe/target/manual-only-artifact/*
